# Render.com blueprint for the BACKEND. Frontend goes to Vercel (see DEPLOYMENT.md).
#
# This uses the Dockerfile and a small persistent disk so the default SQLite DB
# survives restarts/deploys. For a heavier beta, switch DATABASE_URL to a managed
# Postgres instead (see DEPLOYMENT.md) and drop the disk.
services:
  - type: web
    name: four-in-a-thousand-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Chromium needs real RAM; the free tier is too small. Bump if scrapes OOM.
    plan: starter
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /app/backend/data
      sizeGB: 1
    envVars:
      # --- Auth / analytics (this project's own secrets) ---
      - key: AUTH_SECRET          # signs login tokens; must be stable + secret
        generateValue: true
      - key: ADMIN_TOKEN          # guards GET /admin/analytics (X-Admin-Token header)
        generateValue: true
      # Persist SQLite on the mounted disk (four slashes = absolute path).
      - key: DATABASE_URL
        value: sqlite:////app/backend/data/jobmatch.db
      # Comma-separated allowed frontend origins -- set to your Vercel URL(s).
      - key: FRONTEND_ORIGINS
        sync: false
      # --- Engine API keys (set each in the Render dashboard; never commit) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: REED_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: SERPER_DEV_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: CAREERJET_AFFID
        sync: false
      - key: CAREERJET_REFERER
        sync: false
